name: Update clock

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-clock
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Rewrite the README block
        env:
          CLOCK_START: ${{ secrets.CLOCK_START }}
          CLOCK_TZ: ${{ secrets.CLOCK_TZ }}
        run: python3 counter.py --readme README.md

      - name: Commit if the count changed
        run: |
          if git diff --quiet README.md; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update clock"
          git push
