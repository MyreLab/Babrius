name: Update clock

on:
  schedule:
    - cron: "10,30,50 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-clock
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Draw the cards
        env:
          CLOCK_START: ${{ secrets.CLOCK_START }}
          CLOCK_TZ: ${{ secrets.CLOCK_TZ }}
        run: python3 counter.py --cards "$RUNNER_TEMP/cards"

      - name: Publish the cards to the counter-assets branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan counter-assets
          git rm -rf --quiet .
          cp "$RUNNER_TEMP"/cards/*.svg .
          git add ./*.svg
          git commit -q -m "Update clock"
          git push --force origin counter-assets
